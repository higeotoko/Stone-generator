<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>目地編集</title>
  <style>
    :root { color-scheme: light dark; --bg:#f5f6f8; --surface:#fff; --text:#253142; --muted:#647185; --line:#dce1e8; --accent:#2469c0; --outline:#39597e; --fill:#acc5df; --bad:#d64d4d; }
    @media (prefers-color-scheme:dark) { :root { --bg:#20242b; --surface:#292f38; --text:#eef1f5; --muted:#aab5c5; --line:#424b58; --accent:#87b9ff; --outline:#acd0ff; --fill:#536e90; } }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font:13px "Segoe UI","Meiryo","Hiragino Sans",sans-serif; }
    main { padding:16px; } header { margin-bottom:14px; } h1 { margin:0; font-size:19px; } #summary { color:var(--muted); margin-top:5px; font-size:12px; }
    button,input { font:inherit; }
    button { cursor:pointer; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--text); padding:9px 10px; }
    button:hover { border-color:var(--accent); } button:focus-visible,input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    button:disabled { opacity:.4; cursor:default; } button:disabled:hover { border-color:var(--line); }
    .seg { display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--line); border-radius:8px; overflow:hidden; margin-bottom:12px; }
    .seg button { border:0; border-radius:0; background:var(--surface); } .seg button[aria-pressed=true] { background:var(--accent); color:#fff; font-weight:600; }
    @media (prefers-color-scheme:dark) { .seg button[aria-pressed=true] { color:#142438; } }
    .sel { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px; }
    .sel .kind { font-size:12px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; }
    .sel .pos { font-size:22px; font-weight:600; margin-top:4px; } .sel .pos small { font-size:12px; font-weight:400; color:var(--muted); }
    .badge { font-size:10px; font-weight:700; letter-spacing:.04em; border-radius:999px; padding:2px 8px; border:1px solid var(--line); }
    .badge.manual { color:var(--accent); border-color:var(--accent); } .badge.locked { color:#fff; background:var(--bad); border-color:var(--bad); }
    .empty { color:var(--muted); line-height:1.6; }
    .move { display:grid; grid-template-columns:auto 1fr auto; gap:6px; margin-top:12px; align-items:center; }
    .move input { min-height:39px; border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--text); padding:8px; text-align:center; width:100%; }
    .move button { min-width:62px; }
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
    label { display:block; font-size:12px; font-weight:600; } .unit { font-weight:400; color:var(--muted); }
    label input { width:100%; min-height:36px; margin-top:6px; border:1px solid var(--line); border-radius:7px; color:var(--text); background:var(--surface); padding:7px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    details { border-top:1px solid var(--line); margin-top:16px; padding-top:12px; } summary { cursor:pointer; font-weight:600; padding:3px 0 10px; }
    .hint { color:var(--muted); line-height:1.6; margin:7px 0 0; font-size:11px; } kbd { font:11px inherit; border:1px solid var(--line); border-radius:4px; padding:0 4px; background:var(--surface); }
    .actions { display:grid; gap:8px; margin-top:16px; } .primary { border-color:var(--accent); background:var(--accent); color:#fff; font-weight:600; }
    @media (prefers-color-scheme:dark) { .primary { color:#142438; } }
    .danger:hover { border-color:var(--bad); color:var(--bad); }
    #status { margin-top:12px; min-height:18px; line-height:1.5; color:var(--bad); white-space:pre-wrap; }
    [hidden] { display:none!important; }
  </style>
</head>
<body>
<main>
  <header><h1>目地編集</h1><div id="summary"></div></header>

  <div class="seg" role="group" aria-label="選択のしかた">
    <button id="mode-partial" type="button" aria-pressed="true" title="石と石の間の1辺だけ">部分目地</button>
    <button id="mode-through" type="button" aria-pressed="false" title="一直線につながる目地をまとめて（Shift＋クリック）">通り目地</button>
  </div>

  <div class="sel" id="sel">
    <div class="empty" id="empty">モデル上の目地をクリックしてください。<br>ドラッグでそのまま動かせます。</div>
    <div id="detail" hidden>
      <div class="kind"><span id="kind"></span><span id="badge" class="badge"></span></div>
      <div class="pos" id="pos"></div>
      <div class="move">
        <button id="minus" type="button"></button>
        <input id="delta" type="text" inputmode="decimal" value="10" aria-label="移動量 mm">
        <button id="plus" type="button"></button>
      </div>
      <div class="row2">
        <button id="lock" type="button"></button>
        <button id="remove" type="button" class="danger" title="両側の石を1枚に結合します（Delete キーでも可）">🗑 目地を消す</button>
      </div>
    </div>
  </div>

  <details id="material-box"><summary>石厚・目地幅</summary>
    <div class="grid">
      <label>石厚 <span class="unit">mm</span><input id="thickness" type="number" min="1" step="any"></label>
      <label>目地幅 <span class="unit">mm</span><input id="joint" type="number" min="0" step="0.5"></label>
    </div>
    <p class="hint">目地の位置は変わりません。石の形だけ作り直します。</p>
    <div class="actions"><button id="apply" type="button">反映する</button></div>
  </details>

  <details><summary>操作のヒント</summary>
    <p class="hint"><kbd>クリック</kbd> 選択　<kbd>Shift</kbd>+クリック 通り目地　<kbd>Ctrl</kbd>+クリック 追加選択<br>
      <kbd>ドラッグ</kbd> 移動（既存の目地・壁端・中央にスナップ、<kbd>Alt</kbd> で解除）<br>
      ドラッグ中に数値を入力して <kbd>Enter</kbd> で正確に移動<br>
      <kbd>Delete</kbd> 目地を消す　<kbd>Esc</kbd> 取り消し<br>
      石の上で右クリック → 縦目地／横目地を追加</p>
  </details>

  <div class="actions">
    <button id="dialog" type="button">割付の設定…</button>
    <button id="schedule" type="button">石寸法一覧…</button>
    <button id="finish" type="button" class="primary">編集を終える</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<script src="edit_panel.js"></script>
</body>
</html>

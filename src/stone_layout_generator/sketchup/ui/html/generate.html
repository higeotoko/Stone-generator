<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>石割付</title>
  <style>
    :root { color-scheme: light dark; --bg:#f5f6f8; --surface:#fff; --text:#253142; --muted:#647185; --line:#dce1e8; --accent:#2469c0; --outline:#39597e; --fill:#acc5df; --stone:#d9dee6; --bad:#d64d4d; }
    @media (prefers-color-scheme:dark) { :root { --bg:#20242b; --surface:#292f38; --text:#eef1f5; --muted:#aab5c5; --line:#424b58; --accent:#87b9ff; --outline:#acd0ff; --fill:#536e90; --stone:#3a4452; } }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font:13px "Segoe UI","Meiryo","Hiragino Sans",sans-serif; }
    main { max-width:780px; margin:auto; padding:20px; } header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
    h1 { margin:0; font-size:21px; } #mode { color:var(--muted); margin-top:5px; font-size:12px; } button,input,select { font:inherit; }
    button { cursor:pointer; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--text); padding:10px 12px; }
    button:hover { border-color:var(--accent); } button:focus-visible,input:focus-visible,select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    button:disabled { opacity:.45; cursor:default; }
    fieldset { border:0; padding:0; margin:0 0 18px; min-width:0; } legend { font-weight:600; margin-bottom:10px; padding:0; }
    .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .card { min-width:0; padding:12px 7px 9px; text-align:center; border:2px solid transparent; box-shadow:0 0 0 1px var(--line); }
    .card[aria-checked=true] { border-color:var(--accent); box-shadow:none; } .card svg { display:block; width:100%; height:40px; margin-bottom:8px; }
    .card strong { display:block; font-size:12px; } .card small { color:var(--muted); display:block; margin-top:3px; font-size:11px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; } label { display:block; font-size:12px; font-weight:600; }
    input,select { width:100%; min-height:39px; margin-top:6px; border:1px solid var(--line); border-radius:7px; color:var(--text); background:var(--surface); padding:8px; }
    input[type=checkbox] { width:auto; min-height:0; margin:0 8px 0 0; vertical-align:middle; }
    .check { display:flex; align-items:center; font-weight:400; margin-top:12px; }
    input:disabled { opacity:.45; } .unit { font-weight:400; color:var(--muted); } .hint { color:var(--muted); line-height:1.6; margin:7px 0 0; font-size:11px; }
    .presets { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0; } .presets button { padding:5px 10px; border-radius:999px; font-size:11px; }
    .presets button[aria-pressed=true] { border-color:var(--accent); color:var(--accent); }
    details { border-top:1px solid var(--line); margin-top:16px; padding-top:14px; } summary { cursor:pointer; font-weight:600; padding:3px 0 12px; }
    details h3 { font-size:11px; color:var(--muted); font-weight:600; margin:16px 0 8px; } details h3:first-of-type { margin-top:0; }
    .actions { display:grid; gap:8px; margin-top:20px; } .primary { border-color:var(--accent); background:var(--accent); color:#fff; font-weight:600; font-size:14px; padding:12px; }
    @media (prefers-color-scheme:dark) { .primary { color:#142438; } }
    .danger { color:var(--bad); } .danger:hover { border-color:var(--bad); }
    #preview { margin:0 0 18px; } #preview svg { width:100%; height:150px; display:block; background:var(--surface); border:1px solid var(--line); border-radius:8px; }
    #stats { font-size:12px; color:var(--text); margin-top:8px; } #stats b { font-size:15px; }
    #status { margin-top:14px; min-height:18px; line-height:1.5; color:var(--muted); white-space:pre-wrap; } #status.error { color:var(--bad); }
    [hidden] { display:none!important; }
    @media (max-width:330px) { main { padding:14px; } .grid { grid-template-columns:1fr; } } @media (max-width:420px) { main { padding:14px; } }
  </style>
</head>
<body>
<main>
  <header><div><h1>石割付</h1><div id="mode">読み込み中…</div></div></header>

  <figure id="preview">
    <svg id="preview-svg" viewBox="0 0 480 150" role="img" aria-label="割付の展開図"></svg>
    <div id="stats" role="status" aria-live="polite"></div>
  </figure>

  <form id="form">
    <div id="layout-basic">
      <fieldset><legend>目地のパターン</legend><div class="cards" id="patterns" role="radiogroup" aria-label="目地のパターン"></div></fieldset>
      <div class="grid">
        <label>石の幅 <span class="unit">mm</span><input id="stone_width" type="number" min="1" step="any" required></label>
        <label>石の高さ <span class="unit">mm</span><input id="stone_height" type="number" min="1" step="any" required></label>
      </div>
      <div class="presets" id="presets" aria-label="よく使う石の大きさ"></div>
      <label id="row-offset-field" hidden style="margin-top:14px">段ごとのずらし量 <span class="unit">mm</span><input id="row_offset" type="number" min="0" step="any"></label>
    </div>

    <div class="grid" style="margin-top:14px">
      <label id="joint-field">目地幅 <span class="unit">mm</span><input id="joint" type="number" min="0" step="0.5" required></label>
      <label>石厚 <span class="unit">mm</span><input id="thickness" type="number" min="1" step="any" required></label>
    </div>
    <p id="basis-hint" class="hint"></p>

    <details id="advanced"><summary>割付・収まりの詳細</summary>
      <div id="layout-advanced">
      <h3>割付の基準</h3>
      <div class="grid">
        <label>横方向<select id="align_u"><option value="left">左端から</option><option value="right">右端から</option><option value="center">中央そろえ</option><option value="custom">位置を指定</option></select></label>
        <label>縦方向<select id="align_v"><option value="bottom">下端から</option><option value="top">上端から</option><option value="center">中央そろえ</option><option value="custom">位置を指定</option></select></label>
        <label id="origin-u-field" hidden>基準目地の位置 u <span class="unit">mm</span><input id="origin_u" type="number" step="any"></label>
        <label id="origin-v-field" hidden>基準目地の高さ v <span class="unit">mm</span><input id="origin_v" type="number" step="any"></label>
        <label>端部の石<select id="end_mode"><option value="cut">半端石を端に</option><option value="balanced">左右に均等に振り分け</option><option value="uniform">全体を均等に調整</option></select></label>
        <label>寸法の測り方<select id="size_basis"><option value="pitch">目地の芯から芯</option><option value="stone">石そのものの大きさ</option></select></label>
        <label id="start-u-field" hidden>割付の開始位置（周方向） <span class="unit">mm</span><input id="start_u" type="number" step="any"></label>
      </div>
      <label id="corner-field" class="check" hidden><input id="joint_at_corners" type="checkbox">壁の折れ点に縦目地を入れる</label>

      <h3>石の大きさの制限</h3>
      <div class="grid">
        <label>最小の幅 <span class="unit">mm</span><input id="min_width" type="number" min="0" step="any"></label>
        <label>最小の高さ <span class="unit">mm</span><input id="min_height" type="number" min="0" step="any"></label>
        <label>最大の幅 <span class="unit">mm・任意</span><input id="max_width" type="number" min="0" step="any"></label>
        <label>最大の高さ <span class="unit">mm・任意</span><input id="max_height" type="number" min="0" step="any"></label>
      </div>
      </div>

      <h3>目地</h3>
      <label class="check"><input id="split_joint" type="checkbox">縦目地と横目地の幅を分ける</label>
      <div class="grid" id="joint-split" hidden style="margin-top:10px">
        <label>縦目地 <span class="unit">mm</span><input id="joint_v" type="number" min="0" step="0.5"></label>
        <label>横目地 <span class="unit">mm</span><input id="joint_h" type="number" min="0" step="0.5"></label>
      </div>

      <h3>石の位置</h3>
      <div class="grid">
        <label>選択した面は<select id="reference"><option value="finish">石の表面（仕上げ面）</option><option value="substrate">躯体・下地の面</option></select></label>
        <label>厚みを付ける向き<select id="direction"><option value="inward">壁の内側へ</option><option value="outward">壁の外側へ</option></select></label>
        <label id="offset-field" hidden>躯体面から石の表面まで <span class="unit">mm</span><input id="face_offset" type="number" step="any"></label>
      </div>

      <div id="arc-options" hidden>
        <h3>曲面の表示</h3>
        <div class="grid">
          <label>分割の角度 <span class="unit">度以下</span><input id="max_arc_angle" type="number" min="0.5" step="0.5"></label>
          <label>弦の誤差 <span class="unit">mm以下</span><input id="max_arc_error" type="number" min="0.05" step="0.05"></label>
        </div>
        <p class="hint">目地の位置は真円で計算します。ここは画面の滑らかさだけに効きます。</p>
      </div>

      <h3>材質</h3>
      <label>材質名 <span class="unit">任意・モデル内の材質名</span><input id="material" type="text" placeholder="例: 御影石"></label>
    </details>

    <details id="relayout-box" hidden><summary>割付をやり直す</summary>
      <p class="hint">パターン・石の大きさ・基準を変えて最初から割り付けます。<b>手で動かした目地やロックは消えます。</b></p>
      <div id="relayout-slot"></div>
      <div class="actions"><button id="relayout" type="button" class="danger">この条件で全体を再割付</button></div>
    </details>

    <div class="actions"><button id="primary" class="primary" type="submit">石を生成する</button><button id="close" type="button">閉じる</button></div>
    <div id="status" role="status" aria-live="polite"></div>
  </form>
</main>
<script src="generate.js"></script>
</body>
</html>

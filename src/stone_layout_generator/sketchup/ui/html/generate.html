<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>石割付</title>
<style>
  :root { --fg:#222; --muted:#666; --line:#ddd; --accent:#1f6feb; --bad:#c62828; --bg:#fff; }
  body { font: 12px/1.45 -apple-system, "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif; color: var(--fg); background: var(--bg); margin: 0; padding: 10px 12px 60px; }
  h2 { font-size: 12px; margin: 14px 0 6px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 2px; }
  .row { display: flex; align-items: center; margin: 4px 0; gap: 6px; }
  .row label { flex: 0 0 104px; }
  .row input, .row select { flex: 1; min-width: 0; padding: 2px 4px; }
  .unit { flex: 0 0 22px; color: var(--muted); }
  .info { color: var(--muted); margin: 2px 0 6px; }
  .msg { margin-top: 8px; white-space: pre-wrap; }
  .msg.err { color: var(--bad); }
  .buttons { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px; background: #f6f6f6; border-top: 1px solid var(--line); display: flex; gap: 6px; }
  button { padding: 4px 10px; }
  button.primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); border-radius: 3px; }
  .layout-only.locked input, .layout-only.locked select { background: #f2f2f2; }
  #stats { margin-top: 6px; }
</style>
</head>
<body>
<div class="info" id="surface"></div>

<div class="layout-only">
<h2>石寸法</h2>
<div class="row"><label>石幅</label><input id="stone_width" type="number" step="1"><span class="unit">mm</span></div>
<div class="row"><label>石高さ</label><input id="stone_height" type="number" step="1"><span class="unit">mm</span></div>
<div class="row"><label>寸法の基準</label><select id="size_basis"><option value="pitch">目地芯々</option><option value="stone">石の実寸</option></select></div>
<div class="row"><label>最小石幅</label><input id="min_width" type="number"><span class="unit">mm</span></div>
<div class="row"><label>最小石高さ</label><input id="min_height" type="number"><span class="unit">mm</span></div>
<div class="row"><label>最大石幅（任意）</label><input id="max_width" type="number"><span class="unit">mm</span></div>
<div class="row"><label>最大石高さ（任意）</label><input id="max_height" type="number"><span class="unit">mm</span></div>

<h2>割付</h2>
<div class="row"><label>割付形式</label><select id="pattern"><option value="stack">芋目地</option><option value="running">馬踏み目地</option><option value="offset">任意オフセット</option></select></div>
<div class="row"><label>段ずれ量</label><input id="row_offset" type="number"><span class="unit">mm</span></div>
<div class="row"><label>横方向の基準</label><select id="align_u"><option value="left">左端</option><option value="right">右端</option><option value="center">中央</option><option value="custom">任意位置</option></select></div>
<div class="row"><label>任意基準位置 u</label><input id="origin_u" type="number"><span class="unit">mm</span></div>
<div class="row"><label>縦方向の基準</label><select id="align_v"><option value="bottom">下端</option><option value="top">上端</option><option value="center">中央</option><option value="custom">任意位置</option></select></div>
<div class="row"><label>任意基準位置 v</label><input id="origin_v" type="number"><span class="unit">mm</span></div>
<div class="row"><label>端部の処理</label><select id="end_mode"><option value="cut">端部に半端石</option><option value="balanced">左右均等に振り分け</option><option value="uniform">全体を均等に調整</option></select></div>
<div class="row"><label>開始位置（丸柱）</label><input id="start_u" type="number"><span class="unit">mm</span></div>
<div class="row"><label>折れ点に目地</label><input id="joint_at_corners" type="checkbox"></div>
</div>

<h2>目地・石厚</h2>
<div class="row"><label>縦目地幅</label><input id="joint_v" type="number" step="0.5"><span class="unit">mm</span></div>
<div class="row"><label>横目地幅</label><input id="joint_h" type="number" step="0.5"><span class="unit">mm</span></div>
<div class="row"><label>石厚</label><input id="thickness" type="number" step="1"><span class="unit">mm</span></div>

<h2>生成位置</h2>
<div class="row"><label>選択面の意味</label><select id="reference"><option value="finish">仕上げ表面</option><option value="substrate">躯体・下地面</option></select></div>
<div class="row"><label>仕上げ面までの距離</label><input id="face_offset" type="number"><span class="unit">mm</span></div>
<div class="row"><label>厚みの向き</label><select id="direction"><option value="inward">内側へ</option><option value="outward">外側へ</option></select></div>
<div class="row"><label>曲面の最大分割角</label><input id="max_arc_angle" type="number" step="0.5"><span class="unit">°</span></div>
<div class="row"><label>曲面の最大誤差</label><input id="max_arc_error" type="number" step="0.1"><span class="unit">mm</span></div>
<div class="row"><label>材質名（任意）</label><input id="material" type="text"></div>

<div id="stats" class="info"></div>
<div id="msg" class="msg"></div>

<div class="buttons">
  <button id="btn-preview">プレビュー</button>
  <button id="btn-apply" class="primary">生成</button>
  <button id="btn-relayout" style="display:none">全体再割付</button>
  <button id="btn-close">閉じる</button>
</div>

<script>
var state = { mode: 'create', layoutKeys: [] };
var FIELDS = ['stone_width','stone_height','size_basis','min_width','min_height','max_width','max_height','pattern','row_offset',
  'align_u','origin_u','align_v','origin_v','end_mode','start_u','joint_at_corners','joint_v','joint_h','thickness',
  'reference','face_offset','direction','max_arc_angle','max_arc_error','material'];
function $(id) { return document.getElementById(id); }
function collect() {
  var o = {};
  FIELDS.forEach(function (k) {
    var el = $(k);
    if (el.type === 'checkbox') o[k] = el.checked;
    else if (el.type === 'number') o[k] = el.value === '' ? null : Number(el.value);
    else o[k] = el.value === '' ? null : el.value;
  });
  return JSON.stringify(o);
}
function init(info) {
  state.mode = info.mode; state.layoutKeys = info.layout_keys;
  FIELDS.forEach(function (k) {
    var el = $(k), v = info.settings[k];
    if (el.type === 'checkbox') el.checked = !!v; else el.value = (v === null || v === undefined) ? '' : v;
  });
  var s = info.surface;
  $('surface').textContent = '対象: ' + s.segments + ' / 展開長 ' + s.length + ' mm × 高さ ' + s.height + ' mm' + (s.periodic ? '（周回）' : '');
  if (info.mode === 'edit') {
    $('btn-preview').style.display = 'none';
    $('btn-apply').textContent = '反映（目地位置は保持）';
    $('btn-relayout').style.display = '';
    document.querySelector('.layout-only').classList.add('locked');
    state.layoutKeys.forEach(function (k) { var el = $(k); if (el) el.title = '割付寸法の変更は「全体再割付」で反映されます'; });
    if (info.manual) report({ message: 'この割付には手動で調整した目地があります。石厚・目地幅の変更では保持されます。' });
  }
  if (info.warnings && info.warnings.length) report({ warnings: info.warnings });
  if (info.mode === 'create') sketchup.preview(collect());
}
function report(r) {
  var m = $('msg'); m.className = 'msg'; m.textContent = '';
  if (r.error) { m.className = 'msg err'; m.textContent = [].concat(r.error).join('\n'); }
  else if (r.message) { m.textContent = r.message; }
  if (r.warnings && r.warnings.length) m.textContent += (m.textContent ? '\n' : '') + '注意:\n' + r.warnings.join('\n');
  if (r.stats) {
    var t = '石 ' + r.stats.stones + ' 枚 / ' + r.stats.row_count + ' 段';
    if (r.stats.rows && r.stats.rows.length) t += ' / 1段目の端部 左 ' + r.stats.rows[0].first + ' mm・右 ' + r.stats.rows[0].last + ' mm';
    $('stats').textContent = t;
  }
}
function showError(msg) { report({ error: msg }); }
var timer = null;
document.addEventListener('input', function () {
  if (state.mode !== 'create') return;
  clearTimeout(timer); timer = setTimeout(function () { sketchup.preview(collect()); }, 300);
});
$('btn-preview').onclick = function () { sketchup.preview(collect()); };
$('btn-apply').onclick = function () { sketchup.apply(collect()); };
$('btn-relayout').onclick = function () { sketchup.relayout(collect()); };
$('btn-close').onclick = function () { sketchup.close(); };
window.onload = function () { sketchup.ready(); };
</script>
</body>
</html>
